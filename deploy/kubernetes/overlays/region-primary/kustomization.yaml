apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: region-patch.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: agenthub
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: primary.agentmesh.asia
      - op: replace
        path: /spec/tls/0/hosts/0
        value: primary.agentmesh.asia
