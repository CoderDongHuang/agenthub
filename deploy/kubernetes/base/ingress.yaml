apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenthub
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: [agenthub.example.com]
      secretName: agenthub-tls
  rules:
    - host: agenthub.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-ui
                port: {name: http}
