apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenthub
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: [agentmesh.asia]
      secretName: agenthub-tls
  rules:
    - host: agentmesh.asia
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-ui
                port: {name: http}
