apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-engine
  template:
    metadata:
      labels:
        app: python-engine
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: python-engine
      containers:
        - name: python-engine
          image: agenthub/python-engine:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
            - {name: grpc, containerPort: 9091}
          envFrom:
            - configMapRef:
                name: agenthub-config
            - secretRef:
                name: agenthub-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "2", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: python-engine
spec:
  selector:
    app: python-engine
  ports:
    - {name: http, port: 8000, targetPort: http}
    - {name: grpc, port: 9091, targetPort: grpc}
