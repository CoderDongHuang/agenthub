apiVersion: v1
kind: Secret
metadata:
  name: agenthub-secrets
  namespace: agenthub
type: Opaque
stringData:
  DB_HOST: postgresql.example.internal
  DB_PORT: "5432"
  DB_NAME: agenthub
  DB_USER: replace-me
  DB_PASSWORD: replace-me
  REDIS_URL: redis://:replace-me@redis.example.internal:6379/0
  JWT_SECRET: replace-with-at-least-32-random-characters
  AGENTHUB_INTERNAL_TOKEN: replace-with-at-least-32-random-characters
  AGENTHUB_KMS_MASTER_KEY: replace-with-at-least-32-random-characters
  AGENTHUB_ECOSYSTEM_SIGNING_KEY: replace-with-at-least-32-random-characters
