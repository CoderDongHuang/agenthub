server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: ai-agent-hub-java-console
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agenthub}
    username: ${DB_USER:agenthub}
    password: ${DB_PASSWORD:agenthub123}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  data:
    redis:
      url: ${REDIS_URL:redis://:123456@localhost:6380/0}
      repositories:
        enabled: false
  web:
    pageable:
      default-page-size: 20
      max-page-size: 100
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000

grpc:
  server:
    port: 9090
  python:
    host: ${PYTHON_GRPC_HOST:localhost}
    port: ${PYTHON_GRPC_PORT:9091}

python:
  runtime:
    base-url: ${PYTHON_RUNTIME_URL:http://localhost:8000}

agenthub:
  internal-token: ${AGENTHUB_INTERNAL_TOKEN}
  kms:
    master-key: ${AGENTHUB_KMS_MASTER_KEY:${JWT_SECRET}}
  ecosystem:
    signing-key: ${AGENTHUB_ECOSYSTEM_SIGNING_KEY:${AGENTHUB_KMS_MASTER_KEY:${JWT_SECRET}}}
  multimodal:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      vision-model: ${DASHSCOPE_VISION_MODEL:qwen-vl-plus}
      audio-model: ${DASHSCOPE_AUDIO_MODEL:qwen3.5-omni-flash}
      base-url: ${DASHSCOPE_API_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  auth:
    secure-cookie: ${AGENTHUB_SECURE_COOKIE:false}
  cors:
    allowed-origins: ${AGENTHUB_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  channel:
    retry-interval-ms: ${CHANNEL_RETRY_INTERVAL_MS:5000}
  chat:
    max-concurrency: ${AGENTHUB_CHAT_MAX_CONCURRENCY:16}
    queue-capacity: ${AGENTHUB_CHAT_QUEUE_CAPACITY:64}
  routing:
    probe-interval-ms: ${AGENTHUB_ROUTING_PROBE_INTERVAL_MS:60000}
  workflow:
    scheduler-interval-ms: ${AGENTHUB_WORKFLOW_SCHEDULER_INTERVAL_MS:15000}
    worker-interval-ms: ${AGENTHUB_WORKFLOW_WORKER_INTERVAL_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.agenthub: INFO
    org.springframework.security: INFO
