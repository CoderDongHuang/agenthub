server:
  port: 8080

spring:
  application:
    name: ai-agent-hub-java-console
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agenthub}
    username: ${DB_USER:agenthub}
    password: ${DB_PASSWORD:agenthub123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  data:
    redis:
      url: ${REDIS_URL:redis://:123456@localhost:6380/0}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000

grpc:
  server:
    port: 9090
  python:
    host: ${PYTHON_GRPC_HOST:localhost}
    port: ${PYTHON_GRPC_PORT:9091}

python:
  runtime:
    base-url: ${PYTHON_RUNTIME_URL:http://localhost:8000}

agenthub:
  internal-token: ${AGENTHUB_INTERNAL_TOKEN}
  auth:
    secure-cookie: ${AGENTHUB_SECURE_COOKIE:false}
  cors:
    allowed-origins: ${AGENTHUB_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.agenthub: INFO
    org.springframework.security: INFO
