name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      - run: npm run build
        working-directory: web-ui

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode test
        working-directory: java-console

  python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTHUB_DEMO_MODE: 'true'
      AGENTHUB_INTERNAL_TOKEN: ci-internal-token-at-least-32-characters
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: python-engine/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: python-engine
      - run: python -m pytest -q
        working-directory: python-engine

  ecosystem-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - run: kubectl kustomize deploy/kubernetes/base > /dev/null
      - run: kubectl kustomize deploy/kubernetes/overlays/region-primary > /dev/null
      - run: kubectl kustomize deploy/kubernetes/overlays/region-secondary > /dev/null
      - run: docker compose config --quiet
      - run: docker build -f java-console/Dockerfile -t agenthub/java-console:ci .
      - run: docker build -f python-engine/Dockerfile -t agenthub/python-engine:ci .
      - run: docker build -f web-ui/Dockerfile -t agenthub/web-ui:ci .
